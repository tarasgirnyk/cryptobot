services:
  cryptobot:
    build:
      context: .
    container_name: cryptobot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CRYPTBOT_HOST: 0.0.0.0
      CRYPTBOT_PORT: 8765
      DATA_DIR: /app/data
      # For live keys prefer Docker secrets over .env — uncomment together with
      # the `secrets:` blocks below and drop the *_API_KEYS lines from .env:
      # BINANCE_API_KEYS_FILE: /run/secrets/binance_api_keys
      # BYBIT_API_KEYS_FILE: /run/secrets/bybit_api_keys
      # BINGX_API_KEYS_FILE: /run/secrets/bingx_api_keys
      # TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      # API_BEARER_TOKEN_FILE: /run/secrets/api_bearer_token
    ports:
      - "127.0.0.1:${CRYPTBOT_PUBLIC_PORT:-8765}:8765"
    volumes:
      - cryptobot_data:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    # secrets:
    #   - binance_api_keys
    #   - bybit_api_keys
    #   - bingx_api_keys
    #   - telegram_bot_token
    #   - api_bearer_token

volumes:
  cryptobot_data:

